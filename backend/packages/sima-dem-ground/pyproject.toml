[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-dem-ground"
version = "0.1.0"
description = "СИМА — ЦМР: построение цифровой модели рельефа (SMRF + интерполяция)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "laspy>=2.0",
    "rasterio>=1.2",
    "gdal",
    "pdal",
    "sima-dem-core",
]

[tool.setuptools.packages.find]
where = ["src"]