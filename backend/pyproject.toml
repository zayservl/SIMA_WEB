[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-dem"
version = "0.1.0"
description = "СИМА — вычислительная библиотека ЦМР/ЦМД/рельефа (без QGIS)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "laspy>=2.0",
    "rasterio>=1.2",
    "gdal",
    "pdal",
    "shapely>=1.7",
    "pyproj>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sima_dem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=sima_dem",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=75",
]

[tool.coverage.run]
source = ["sima_dem"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]