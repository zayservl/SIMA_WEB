[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sima-dem-monorepo"
version = "0.1.0"
description = "СИМА — монорепозиторий вычислительных библиотек ЦМР/ЦМД/рельефа"
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=sima_dem_core",
    "--cov=sima_dem_ground",
    "--cov=sima_dem_dsm",
    "--cov=sima_relief_service",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=75",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]